<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>星河七夕 · 洛小白</title><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><style>
:root{--night:#090a0f;--ink:#edf4ff;--gold:#ffd777;--paper:#e5dfd1}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:radial-gradient(ellipse at bottom,#1b2735 0%,#090a0f 100%);font-family:system-ui,"Microsoft YaHei",sans-serif}button{font:inherit}#qixi{position:relative;width:100%;height:100%;overflow:hidden;color:var(--ink)}canvas.three-bg{position:fixed;z-index:8;inset:0;pointer-events:none;opacity:1}.milky-way{position:absolute;z-index:0;inset:-10%;background:radial-gradient(ellipse 900px 180px at 50% 62%,rgba(180,205,255,.13),transparent 62%);transform:rotate(-15deg);filter:blur(2px)}.star-field{position:absolute;z-index:1;inset:0;pointer-events:none}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.45;animation:twinkle var(--twinkle,3s) var(--delay,0s) infinite ease-in-out}.star.medium{width:3px;height:3px}.star.large{width:4px;height:4px;box-shadow:0 0 10px rgba(255,255,255,.85)}.moon{position:absolute;z-index:3;top:10%;right:14%;width:min(16vw,105px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 32% 30%,#fff 0%,#e3e8ef 56%,#a6b0c0 100%);box-shadow:0 0 50px rgba(255,255,255,.25);animation:moonGlow 6s ease-in-out infinite alternate}.shooting-star{position:absolute;z-index:4;width:170px;height:2px;border-radius:99px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),#fff);filter:drop-shadow(0 0 5px #dceaff);opacity:0;transform:rotate(-28deg);animation:shoot 1.25s ease-out both}.shooting-star::after{content:"";position:absolute;right:-2px;top:-2px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 9px #b9dfff}.constellation{position:absolute;z-index:12;width:230px;height:150px;color:var(--gold);pointer-events:none}.taurus-constellation{top:25%;left:7%}.cancer-constellation{top:39%;right:7%}.constellation svg{width:100%;height:100%;overflow:visible}.constellation line{stroke:rgba(255,215,119,.42);stroke-width:1}.constellation circle{fill:#fff0b7;filter:drop-shadow(0 0 6px #ffd777)}.constellation .major{r:4.5}.constellation text{font:12px Georgia,"Songti SC",serif;letter-spacing:.12em;fill:#f5d988}.card{position:absolute;z-index:20;top:6%;left:50%;width:min(640px,84vw);height:190px;perspective:1600px;transform:translate(-50%,-175%) rotate(-2deg);transition:transform 1.15s cubic-bezier(.2,1.1,.3,1)}.card-cover,.card-inside{position:absolute;inset:0;border-radius:3px}.card-cover{z-index:2;display:grid;place-items:center;align-content:center;gap:12px;border:1px solid rgba(196,162,100,.6);color:#eadfca;background:linear-gradient(135deg,#17233b,#0b1220 58%,#1a2941);box-shadow:0 20px 50px rgba(0,0,0,.58);transform-origin:left center;transition:transform 1.2s cubic-bezier(.55,.06,.33,1),opacity .55s .75s}.card-cover h1{margin:0;font:500 clamp(26px,4vw,39px) Georgia,"Songti SC",serif;letter-spacing:.14em}.card-kicker,.card-hint{font-size:10px;letter-spacing:.25em;color:#b9a37b}.card-seal{position:absolute;right:24px;top:20px;border:1px solid #b39460;border-radius:50%;padding:11px;color:#dbc38e}.card-inside{display:grid;grid-template-columns:1fr 1fr;overflow:hidden;background:#ddd5c4;color:#28334a}.card-page{padding:28px;font:17px/1.65 Georgia,"Songti SC",serif}.page-left{border-right:1px solid #aa9a7c;background:radial-gradient(circle,rgba(205,174,102,.2),transparent 40%)}.page-left span{position:absolute;bottom:25px;font:10px system-ui;letter-spacing:.18em;color:#817157}.page-right .seal{float:right;border:1px solid #9d4d4a;border-radius:50%;padding:6px;color:#8d2936;font-size:13px}.page-right p{margin:8px 0}.card-arrive .card{transform:translate(-50%,0) rotate(-1deg)}.card-open .card-cover{transform:rotateY(-168deg);opacity:0}.actors{position:absolute;z-index:15;bottom:31%;left:50%;width:min(820px,93vw);height:225px;transform:translateX(-50%)}.actor{position:absolute;bottom:0;width:154px;height:220px;object-fit:contain;transition:left 3s cubic-bezier(.34,.88,.2,1),opacity .55s,transform .25s}.fire{left:5%;filter:drop-shadow(0 0 14px #ff5d39)}.water{left:77%;filter:drop-shadow(0 0 14px #4fd0ff)}.walk .fire{left:39%;transform:translateY(-8px)}.walk .water{left:48%;transform:translateY(-8px) scaleX(-1)}.heart{position:absolute;bottom:18px;left:50%;z-index:3;width:140px;height:125px;opacity:0;transform:translateX(-50%) scale(.15);clip-path:path('M70 117 C59 106 4 75 4 39 C4 11 35 1 53 19 C61 26 65 34 70 42 C75 34 79 26 87 19 C105 1 136 11 136 39 C136 75 81 106 70 117 Z');background:linear-gradient(110deg,#ffd26a,#f35b49 36%,#cc3e78 51%,#61c9ed 72%,#dafbff);filter:drop-shadow(-16px 0 24px #ff6d48) drop-shadow(16px 0 24px #62d7ff)}.fuse .actor{opacity:0}.fuse .heart{opacity:1;transform:translateX(-50%) scale(1);transition:.7s cubic-bezier(.25,1.65,.45,1);animation:beat 1s .8s infinite alternate}.reveal .card{opacity:0;transform:translate(-50%,-120%) scale(.92);transition:opacity .65s,transform .65s}.quote{position:absolute;z-index:25;bottom:62%;left:50%;width:90%;margin:0;color:#eef5ff;opacity:0;transform:translate(-50%,26px);text-align:center;font:400 clamp(22px,3.4vw,46px)/1.5 Georgia,"Songti SC",serif;text-shadow:0 3px 14px #050914}.qixi-message-card{position:absolute;z-index:26;left:50%;bottom:3%;width:min(680px,82vw);min-height:118px;padding:22px 34px;border:1px solid rgba(224,203,148,.62);background:linear-gradient(135deg,rgba(234,228,211,.97),rgba(203,193,169,.97));color:#293245;box-shadow:0 18px 42px rgba(0,0,0,.42);opacity:0;transform:translate(-50%,42px) rotateX(-75deg);transform-origin:bottom;transition:opacity .7s .45s,transform .9s .45s cubic-bezier(.22,1.3,.35,1)}.qixi-message-card::before{content:"";position:absolute;inset:9px;border:1px solid rgba(139,109,62,.28);pointer-events:none}.qixi-message-card h2{position:relative;margin:0 0 7px;color:#76552a;font:600 17px Georgia,"Songti SC",serif;letter-spacing:.18em}.qixi-message-card p{position:relative;margin:3px 0;font:16px/1.6 Georgia,"Songti SC",serif}.qixi-message-card .from{color:#98713b;text-align:right;font-size:14px}.reveal .quote{opacity:1;transform:translate(-50%,0);transition:.8s}.reveal .qixi-message-card{opacity:1;transform:translate(-50%,0) rotateX(0)}.back,.replay{position:fixed;z-index:30;bottom:20px;padding:10px 18px;border:1px solid #706044;border-radius:999px;color:#e8dcc4;background:rgba(11,18,35,.82);cursor:pointer}.back{left:20px}.replay{right:20px}@keyframes twinkle{50%{opacity:1;transform:scale(1.35)}}@keyframes shoot{0%{opacity:0;transform:translate(-100px,100px) rotate(-28deg)}15%{opacity:1}100%{opacity:0;transform:translate(390px,-290px) rotate(-28deg)}}@keyframes moonGlow{to{box-shadow:0 0 80px rgba(255,255,255,.45)}}@keyframes beat{to{transform:translateX(-50%) scale(1.12)}}@media(max-width:600px){.constellation{transform:scale(.68)}.taurus-constellation{left:-3%;top:29%}.cancer-constellation{right:-7%;top:40%}.card{height:166px}.card-page{padding:18px;font-size:14px}.actors{bottom:27%}.actor{width:120px;height:180px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main id="qixi" aria-label="第一关通关后的七夕星河结局"><div class="milky-way"></div><div class="star-field" aria-hidden="true"></div><div class="moon"></div><div class="taurus-constellation constellation" aria-label="金牛座 Taurus"><svg viewBox="0 0 230 150"><line x1="25" y1="85" x2="65" y2="45"/><line x1="65" y1="45" x2="112" y2="68"/><line x1="112" y1="68" x2="160" y2="37"/><line x1="112" y1="68" x2="150" y2="112"/><circle class="major" cx="25" cy="85"/><circle cx="65" cy="45" r="3"/><circle class="major" cx="112" cy="68"/><circle cx="160" cy="37" r="3"/><circle cx="150" cy="112" r="3"/><text x="25" y="137">金牛座 · TAURUS</text></svg></div><div class="cancer-constellation constellation" aria-label="巨蟹座 Cancer"><svg viewBox="0 0 230 150"><line x1="22" y1="43" x2="70" y2="72"/><line x1="70" y1="72" x2="121" y2="48"/><line x1="121" y1="48" x2="169" y2="81"/><line x1="169" y1="81" x2="140" y2="118"/><circle cx="22" cy="43" r="3"/><circle class="major" cx="70" cy="72"/><circle cx="121" cy="48" r="3"/><circle class="major" cx="169" cy="81"/><circle cx="140" cy="118" r="3"/><text x="43" y="142">巨蟹座 · CANCER</text></svg></div><section class="card" aria-label="七夕贺卡"><div class="card-cover"><span class="card-kicker">QIXI · 2026</span><span class="card-seal">七夕</span><h1>给洛小白</h1><span class="card-hint">轻启此笺</span></div><div class="card-inside"><div class="card-page page-left"><span>FOREST TEMPLE</span></div><div class="card-page page-right"><span class="seal">七夕</span><p>致独一无二的你：</p><p>愿每一次并肩，都通往更辽阔的星河。</p></div></div></section><div class="actors"><img class="actor fire" src="assets/qixi/fire-complete-0.png" alt="火人"><img class="actor water" src="assets/qixi/water-complete-0.png" alt="冰人"><div class="heart"></div></div><p class="quote">与其说你美好，不如说，你不可重复</p><section class="qixi-message-card" aria-label="写给洛小白的贺卡"><h2>给洛小白</h2><p>星河见证这一刻：愿我们每一次并肩，都走向更辽阔的未来。</p><p class="from">—— 与你同行</p></section></main><button class="back">返回游戏</button><button class="replay">重新播放</button> <script>(function(){const room=new URLSearchParams(location.search).get('room')||'';const CONSTELLATIONS={aries:{cn:'白羊座',en:'ARIES',points:[[15,76],[55,42],[104,64],[150,34],[192,74]],lines:[[0,1],[1,2],[2,3],[3,4]]},taurus:{cn:'金牛座',en:'TAURUS',points:[[25,85],[65,45],[112,68],[160,37],[150,112]],lines:[[0,1],[1,2],[2,3],[2,4]]},gemini:{cn:'双子座',en:'GEMINI',points:[[22,40],[65,76],[112,42],[160,78],[202,45]],lines:[[0,1],[1,2],[2,3],[3,4]]},cancer:{cn:'巨蟹座',en:'CANCER',points:[[22,43],[70,72],[121,48],[169,81],[140,118]],lines:[[0,1],[1,2],[2,3],[3,4]]},leo:{cn:'狮子座',en:'LEO',points:[[20,72],[58,40],[96,68],[138,45],[188,78]],lines:[[0,1],[1,2],[2,3],[3,4]]},virgo:{cn:'处女座',en:'VIRGO',points:[[18,86],[52,46],[88,74],[128,40],[168,65],[206,35]],lines:[[0,1],[1,2],[2,3],[3,4],[4,5]]},libra:{cn:'天秤座',en:'LIBRA',points:[[28,50],[100,50],[172,50],[65,92],[138,92]],lines:[[0,1],[1,2],[0,3],[2,4]]},scorpio:{cn:'天蝎座',en:'SCORPIO',points:[[20,42],[55,72],[92,45],[130,78],[166,50],[205,90]],lines:[[0,1],[1,2],[2,3],[3,4],[4,5]]},sagittarius:{cn:'射手座',en:'SAGITTARIUS',points:[[20,88],[62,55],[104,85],[146,44],[198,70]],lines:[[0,1],[1,2],[2,3],[3,4]]},capricorn:{cn:'摩羯座',en:'CAPRICORN',points:[[18,44],[58,82],[98,48],[140,86],[186,50]],lines:[[0,1],[1,2],[2,3],[3,4]]},aquarius:{cn:'水瓶座',en:'AQUARIUS',points:[[20,46],[58,84],[98,50],[138,88],[184,52]],lines:[[0,1],[1,2],[2,3],[3,4]]},pisces:{cn:'双鱼座',en:'PISCES',points:[[20,45],[62,78],[105,48],[150,82],[198,45]],lines:[[0,1],[1,2],[2,3],[3,4]]}};function loadCard(){try{return JSON.parse(sessionStorage.getItem('qixi-card:'+room)||'null')}catch(_){return null}}function setText(selector,value){var el=document.querySelector(selector);if(el&&value)el.textContent=value}function renderConstellation(selector,key){var root=document.querySelector(selector+' svg');var spec=CONSTELLATIONS[key]||CONSTELLATIONS.taurus;if(!root)return;root.innerHTML='';spec.lines.forEach(function(pair){var l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',spec.points[pair[0]][0]);l.setAttribute('y1',spec.points[pair[0]][1]);l.setAttribute('x2',spec.points[pair[1]][0]);l.setAttribute('y2',spec.points[pair[1]][1]);root.appendChild(l)});spec.points.forEach(function(p,i){var c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r',i===0||i===Math.floor(spec.points.length/2)?4.5:3);root.appendChild(c)});var text=document.createElementNS('http://www.w3.org/2000/svg','text');text.setAttribute('x','18');text.setAttribute('y','142');text.textContent=spec.cn+' · '+spec.en;root.appendChild(text)}function applyConstellations(card){var left=card&&card.leftConstellation||'taurus',right=card&&card.rightConstellation||'cancer';renderConstellation('.taurus-constellation',left);renderConstellation('.cancer-constellation',right);document.querySelector('.taurus-constellation')?.classList.add('custom-constellation');document.querySelector('.cancer-constellation')?.classList.add('custom-constellation')}const cardConfig=loadCard();if(cardConfig){setText('.card-cover h1','给'+cardConfig.to);setText('.qixi-message-card h2','给'+cardConfig.to);setText('.qixi-message-card p:not(.from)',cardConfig.message);setText('.qixi-message-card .from',cardConfig.from)}applyConstellations(cardConfig);const field=document.querySelector('.star-field'),q=document.querySelector('#qixi');function createStars(){for(let i=0;i<180;i++){const s=document.createElement('i'),r=Math.random();s.className='star'+(r>.86?' large':r>.65?' medium':'');s.style.left=(Math.random()*100)+'%';s.style.top=(Math.random()*100)+'%';s.style.setProperty('--delay',(-Math.random()*5)+'s');s.style.setProperty('--twinkle',(2.4+Math.random()*3.8)+'s');field.appendChild(s)}}function shootingStar(){const s=document.createElement('i');s.className='shooting-star';s.style.top=(8+Math.random()*48)+'%';s.style.left=(-10+Math.random()*38)+'%';q.appendChild(s);setTimeout(()=>s.remove(),1400)}createStars();setInterval(()=>{if(Math.random()>.45)shootingStar()},2200);const C=4200,T=.05,can=document.querySelector('#particle-canvas'),ren=new THREE.WebGLRenderer({canvas:can,alpha:true,antialias:true}),sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);cam.position.z=14;cam.position.y=2;ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));const g=new THREE.BufferGeometry(),p=new Float32Array(C*3),t=new Float32Array(C*3);for(let i=0;i<C*3;i++)p[i]=(Math.random()-.5)*8;t.set(p);g.setAttribute('position',new THREE.BufferAttribute(p,3));function createParticleTexture(){const c=document.createElement('canvas'),x=c.getContext('2d'),r=32;c.width=c.height=r;const glow=x.createRadialGradient(r/2,r/2,0,r/2,r/2,r/2);glow.addColorStop(0,'rgba(255,255,255,1)');glow.addColorStop(.28,'rgba(210,240,255,.95)');glow.addColorStop(.66,'rgba(120,210,255,.38)');glow.addColorStop(1,'rgba(120,210,255,0)');x.fillStyle=glow;x.fillRect(0,0,r,r);const texture=new THREE.CanvasTexture(c);texture.needsUpdate=true;return texture}const particleTexture=createParticleTexture(),mat=new THREE.PointsMaterial({color:0xa9e4ff,size:.19,map:particleTexture,transparent:true,opacity:.96,alphaTest:.04,depthWrite:false,blending:THREE.AdditiveBlending}),pts=new THREE.Points(g,mat);pts.position.y=1.8;pts.scale.set(1.08,1.08,1.08);sc.add(pts);function sph(r){let a=Math.random()*6.28,b=Math.acos(2*Math.random()-1);return[r*Math.sin(b)*Math.cos(a),r*Math.sin(b)*Math.sin(a),r*Math.cos(b)]}const shapes={sphere:()=>sph(4),fireworks:()=>sph(Math.random()*7),flower:()=>{let a=Math.random()*6.28,b=Math.random()*3.14,r=3+Math.sin(5*a)*Math.sin(4*b);return[r*Math.sin(b)*Math.cos(a),r*Math.sin(b)*Math.sin(a),r*Math.cos(b)*.5]},heart:()=>{let a=Math.random()*6.28,x=16*Math.sin(a)**3,y=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a);return[x*.28,y*.28+2,(Math.random()-.5)*1.4]}};const shapeCycle=['sphere','flower','fireworks','heart'];let n=0;function setShape(k){for(let i=0;i<C;i++){let v=shapes[k]();t.set(v,i*3)}}setShape('sphere');setInterval(()=>{n=(n+1)%4;setShape(shapeCycle[n])},5000);function loop(){requestAnimationFrame(loop);for(let i=0;i<C*3;i++)p[i]+=(t[i]-p[i])*T;g.attributes.position.needsUpdate=true;mat.opacity=q.classList.contains('fuse')?.1:.58;pts.rotation.y+=.0015;ren.render(sc,cam)}loop();addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});let run=0,timer;function frame(i){document.querySelector('.fire').src='assets/qixi/fire-complete-'+i%2+'.png';document.querySelector('.water').src='assets/qixi/water-complete-'+i%2+'.png'}function play(){let id=++run;clearInterval(timer);q.className='';frame(0);requestAnimationFrame(()=>q.classList.add('card-arrive'));setTimeout(()=>id===run&&q.classList.add('card-open'),1150);setTimeout(()=>{if(id===run){q.classList.add('walk');timer=setInterval(()=>frame(Math.floor(performance.now()/150)%2),150)}},2800);setTimeout(()=>{if(id===run){q.classList.add('fuse');clearInterval(timer)}},6000);setTimeout(()=>id===run&&q.classList.add('reveal'),7350)}document.querySelector('.replay').onclick=play;document.querySelector('.back').onclick=()=>location.replace('index.html');play()}());</script></body></html>
