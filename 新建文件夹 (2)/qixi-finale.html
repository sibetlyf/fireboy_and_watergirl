<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>七夕鹊桥 · 洛小白</title>
<style>
:root{--night:#050914;--navy:#0b1224;--ink:#f0f3f8;--muted:#9ba8bc;--gold:#c4a264;--gold-dim:#6a593f;--paper:#e5dfd1;color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--night);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button{font:inherit}
#qixi{position:relative;width:100%;height:100%;overflow:hidden;color:var(--ink);background:radial-gradient(ellipse at 50% 8%,#202b4b 0,#0b1224 46%,#050914 100%)}
.stars,.stars::before,.stars::after{position:absolute;inset:0;content:"";background-image:radial-gradient(rgba(244,233,190,.72) 1px,transparent 1.55px),radial-gradient(rgba(164,193,232,.46) 1px,transparent 1.6px);background-position:5vw 13vh,81vw 20vh;background-size:18vw 17vh,24vw 22vh;opacity:.52;animation:drift 12s linear infinite}.stars::before{background-size:28vw 25vh,20vw 19vh;opacity:.38;animation-duration:18s}.meteor-field{position:absolute;z-index:2;inset:0;overflow:hidden;pointer-events:none;opacity:0;transition:opacity 1.2s ease}.meteors-on .meteor-field{opacity:1}.meteor{position:absolute;top:var(--meteor-top);left:0;width:var(--meteor-length);height:2px;border-radius:999px;color:var(--meteor-color);background:linear-gradient(90deg,transparent,currentColor 78%,rgba(255,255,255,.98));filter:drop-shadow(0 0 6px currentColor);transform:translate3d(125vw,0,0) rotate(-24deg);animation:meteorFall var(--meteor-duration) var(--meteor-delay) linear infinite}.meteor::before,.meteor::after{position:absolute;top:0;left:calc(var(--meteor-width) / -2);width:var(--meteor-width);height:100%;border-radius:inherit;background:linear-gradient(90deg,transparent,currentColor,transparent);content:"";animation:meteorBlink 1.9s linear infinite}.meteor::before{transform:rotate(45deg)}.meteor::after{transform:rotate(-45deg)}.moon{position:absolute;left:50%;top:15%;width:min(52vw,560px);height:min(52vw,560px);border:1px solid rgba(216,224,239,.08);border-radius:50%;transform:translateX(-50%);box-shadow:0 0 70px rgba(94,120,165,.1)}.mist{position:absolute;width:320px;height:68px;border-radius:50%;background:radial-gradient(ellipse,rgba(109,133,178,.16),transparent 68%);filter:blur(7px)}.mist.a{left:-7%;top:47%}.mist.b{right:-8%;top:43%}
.lantern{position:absolute;top:8%;width:48px;height:62px;display:grid;place-items:center;border:1px solid #8c7045;border-radius:46% 46% 40% 40%;color:#e7d6af;background:linear-gradient(90deg,#30121a,#70262e,#30121a);box-shadow:0 0 18px rgba(172,110,60,.3);font-family:Georgia,"Songti SC",serif;font-size:22px}.lantern::before{position:absolute;top:-74px;left:50%;width:1px;height:74px;background:#75603f;content:""}.lantern::after{position:absolute;bottom:-21px;left:50%;width:12px;height:21px;border-right:1px solid #94764a;border-left:1px solid #94764a;content:"";transform:translateX(-50%)}.lantern.left{left:7%}.lantern.right{right:7%}
/* 暗色实体贺卡：封面入场，沿左侧书脊展开，露出双页内页。 */
.card{position:absolute;z-index:20;top:6%;left:50%;width:min(640px,84vw);height:190px;perspective:1600px;transform:translate(-50%,-175%) rotate(-2deg);transition:transform 1.15s cubic-bezier(.2,1.1,.3,1)}.card-cover,.card-inside{position:absolute;inset:0;border-radius:3px}.card-cover{z-index:2;display:grid;align-content:center;justify-items:center;gap:12px;border:1px solid rgba(196,162,100,.6);color:#eadfca;background:linear-gradient(135deg,#17233b,#0b1220 58%,#1a2941);box-shadow:0 20px 50px rgba(0,0,0,.58);transform-origin:left center;transition:transform 1.2s cubic-bezier(.55,.06,.33,1),opacity .55s .75s}.card-cover::before{position:absolute;inset:11px;border:1px solid rgba(196,162,100,.22);content:""}.card-kicker{font-size:10px;letter-spacing:.28em;color:#a6926e}.card-cover h1{margin:0;font:500 clamp(26px,4vw,39px)/1.05 Georgia,"Songti SC",serif;letter-spacing:.14em}.card-seal{position:absolute;top:20px;right:24px;display:grid;width:42px;height:42px;place-items:center;border:1px solid #b39460;border-radius:50%;color:#dbc38e;font:14px Georgia,"Songti SC",serif;transform:rotate(12deg)}.card-hint{font-size:11px;letter-spacing:.19em;color:#8592a7}.card-inside{display:grid;grid-template-columns:1fr 1fr;overflow:hidden;border:1px solid rgba(196,162,100,.48);background:#d8d0bf;box-shadow:0 20px 50px rgba(0,0,0,.4)}.card-page{position:relative;padding:25px 28px;color:#28334a;background:linear-gradient(135deg,#e8e2d6,#cfc6b3)}.page-left{border-right:1px solid rgba(83,68,47,.23);background:radial-gradient(circle at 50% 46%,rgba(196,162,100,.22),transparent 32%),#ddd5c4}.page-left span{position:absolute;bottom:25px;left:28px;color:#817157;font-size:10px;letter-spacing:.22em}.page-left i{position:absolute;top:50%;left:50%;display:grid;width:72px;height:72px;place-items:center;border:1px solid rgba(120,96,55,.35);border-radius:50%;color:#997a48;font-style:normal;font-size:25px;transform:translate(-50%,-50%)}.page-left i::before{content:"✦"}.page-right{font-family:Georgia,"Songti SC",serif}.page-right .seal{position:absolute;top:17px;right:22px;border:1px solid #a4655e;border-radius:50%;padding:7px;color:#8d2936;font-size:13px}.page-right p{margin:8px 0;font-size:17px;line-height:1.65}.card-arrive .card{transform:translate(-50%,0) rotate(-1deg)}.card-open .card-cover{transform:rotateY(-168deg);opacity:0;pointer-events:none}
/* 电影感三孔鹊桥：月白石砌桥身、暗金桥面、桥台与灯火倒影。 */
.bridge{position:absolute;z-index:4;bottom:22%;left:50%;width:min(1000px,98vw);height:270px;transform:translateX(-50%) scaleX(.1);transform-origin:center;transition:transform 1.45s 1s cubic-bezier(.18,.9,.25,1);filter:drop-shadow(0 24px 24px rgba(0,0,0,.45))}.bridge-arches{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.bridge-mass{fill:url(#stone);stroke:rgba(233,229,214,.52);stroke-width:3}.bridge-shadow{fill:#080d1b;opacity:.78}.bridge-archline{fill:none;stroke:#202936;stroke-width:13;opacity:.92}.bridge-holes{fill:#070d18;opacity:.86;stroke:#aeb9c5;stroke-width:2;stroke-opacity:.32}.bridge-deck{fill:url(#rail);stroke:#f0d79a;stroke-width:1.5}.bridge-rail{fill:none;stroke:url(#rail);stroke-width:5}.bridge-posts{fill:none;stroke:#d5b875;stroke-width:4;stroke-linecap:round}.bridge-keystone{fill:#f0d79a;stroke:#76603e;stroke-width:2;filter:drop-shadow(0 0 9px rgba(240,215,154,.45))}.bridge-stones{fill:none;stroke:rgba(42,48,58,.55);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:20 8}.bridge-pier{position:absolute;bottom:18px;width:52px;height:84px;background:linear-gradient(90deg,#343b47,#a8aa9f,#444b57);opacity:.85;box-shadow:0 13px 19px rgba(0,0,0,.5)}.pier-a{left:32%}.pier-b{right:32%}.bridge-lamp{position:absolute;top:86px;width:9px;height:42px;border-left:1px solid #d4b36b}.bridge-lamp i{position:absolute;left:-8px;bottom:-2px;width:16px;height:18px;border:1px solid #ddc27d;border-radius:9px 9px 6px 6px;background:radial-gradient(circle,#fff3bc 0 13%,#d69d45 35%,rgba(214,157,69,.08) 72%);box-shadow:0 0 22px rgba(224,177,88,.65)}.lamp-a{left:19%}.lamp-b{right:19%}.bridge-water::after{position:absolute;z-index:-1;bottom:-42px;left:10%;width:80%;height:70px;content:"";background:linear-gradient(180deg,rgba(124,160,198,.14),transparent);filter:blur(14px);transform:scaleY(.8)}.bridge-reflection{position:absolute;z-index:-2;left:17%;bottom:-85px;width:66%;height:118px;opacity:.28;transform:scaleY(-1);filter:blur(3px);background:linear-gradient(180deg,rgba(184,193,208,.32),rgba(72,94,125,.08) 58%,transparent);clip-path:polygon(0 0,100% 0,88% 100%,12% 100%)}.water-ripples{position:absolute;z-index:-1;bottom:-66px;left:50%;width:70%;height:55px;transform:translateX(-50%);background:repeating-radial-gradient(ellipse at center,rgba(177,202,226,.23) 0 1px,transparent 2px 13px);filter:blur(.4px);opacity:.55}.lamp-reflection{position:absolute;z-index:-1;bottom:-76px;width:18px;height:78px;opacity:.72;background:repeating-linear-gradient(180deg,rgba(255,218,130,.85) 0 5px,rgba(216,161,68,.35) 6px 10px,transparent 11px 17px);filter:blur(1.6px);transform:skewX(-8deg)}.reflection-a{left:20%}.reflection-b{right:20%;transform:skewX(8deg)}.bridge-ready .bridge{transform:translateX(-50%) scaleX(1)}
.magpies{position:absolute;z-index:6;bottom:44%;left:50%;width:min(760px,94vw);height:160px;transform:translateX(-50%)}.magpie{position:absolute;width:118px;height:58px;fill:#0c1220;stroke:#dae6f5;stroke-width:1.3;filter:drop-shadow(0 4px 5px rgba(0,0,0,.45))}.magpie .wing{fill:#e9ece6;stroke:#0d1320;transform-box:fill-box;transform-origin:72% 78%;animation:wing .42s infinite alternate ease-in-out}.magpie .tail{fill:#0b1120;stroke:#cddbeb}.magpie.a{top:68px;left:17%;animation:fly-a 4s infinite ease-in-out}.magpie.b{top:12px;left:44%;transform:scale(.82) rotate(-7deg);animation:fly-b 4.5s .5s infinite ease-in-out}.magpie.c{top:70px;left:67%;transform:scale(.7) rotate(8deg);animation:fly-c 3.7s 1s infinite ease-in-out}
.actors{position:absolute;z-index:8;bottom:31%;left:50%;width:min(820px,93vw);height:225px;transform:translateX(-50%)}.actor{position:absolute;bottom:0;width:154px;height:220px;object-fit:contain;filter:drop-shadow(0 15px 14px rgba(0,0,0,.48));transition:left 3s cubic-bezier(.34,.88,.2,1),opacity .55s,transform .25s}.fire{left:5%;filter:drop-shadow(0 0 14px rgba(255,93,57,.85)) drop-shadow(0 15px 14px rgba(0,0,0,.48))}.water{left:77%;filter:drop-shadow(0 0 14px rgba(79,208,255,.85)) drop-shadow(0 15px 14px rgba(0,0,0,.48))}.walk .fire{left:39%;transform:translateY(-8px)}.walk .water{left:48%;transform:translateY(-8px) scaleX(-1)}
.heart{position:absolute;bottom:18px;left:50%;z-index:2;width:140px;height:125px;opacity:0;transform:translateX(-50%) scale(.15);clip-path:path('M70 117 C59 106 4 75 4 39 C4 11 35 1 53 19 C61 26 65 34 70 42 C75 34 79 26 87 19 C105 1 136 11 136 39 C136 75 81 106 70 117 Z');background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.88) 0 3px,transparent 4px),linear-gradient(110deg,#ffd26a 0%,#f35b49 36%,#cc3e78 51%,#61c9ed 69%,#dafbff 100%);filter:drop-shadow(-16px 0 24px rgba(255,109,72,.78)) drop-shadow(16px 0 24px rgba(98,215,255,.78))}.fuse .actor{opacity:0}.fuse .heart{opacity:1;transform:translateX(-50%) scale(1);transition:opacity .45s .2s,transform .72s .2s cubic-bezier(.25,1.65,.45,1);animation:heart-beat 1s .85s infinite alternate}.burst{position:absolute;z-index:7;bottom:40%;left:50%;width:8px;height:8px;border-radius:50%;opacity:0;background:#fff4ce;transform:translateX(-50%);box-shadow:0 0 0 0 rgba(255,109,145,.85)}.fuse .burst{opacity:1;animation:burst 1.2s ease-out forwards}
.quote{position:absolute;z-index:12;bottom:11%;left:50%;width:min(90vw,790px);margin:0;color:#eaf0f7;opacity:0;transform:translate(-50%,26px);text-align:center;font:400 clamp(22px,3.4vw,46px)/1.5 Georgia,"Songti SC",serif;letter-spacing:.08em;text-shadow:0 3px 14px #050914}.signature{position:absolute;z-index:12;right:12%;bottom:6.5%;margin:0;color:#c9a86a;opacity:0;transform:translateY(14px);font:17px Georgia,"Songti SC",serif;letter-spacing:.15em}.reveal .quote{opacity:1;transform:translate(-50%,0);transition:opacity .8s,transform .8s}.reveal .signature{opacity:1;transform:translateY(0);transition:opacity .75s .6s,transform .75s .6s}.back,.replay{position:fixed;z-index:30;bottom:20px;padding:10px 18px;border:1px solid #706044;border-radius:999px;color:#e8dcc4;background:rgba(11,18,35,.82);box-shadow:0 8px 26px rgba(0,0,0,.3);cursor:pointer;font-size:14px;backdrop-filter:blur(12px)}.back{left:20px}.replay{right:20px}.back:focus-visible,.replay:focus-visible{outline:2px solid #c4a264;outline-offset:3px}
@keyframes drift{to{transform:translateY(7px)}}@keyframes meteorFall{to{transform:translate3d(-28vw,0,0) rotate(-24deg)}}@keyframes meteorBlink{50%{opacity:.45}}@keyframes wing{to{transform:rotate(-27deg) translateY(-4px)}}@keyframes fly-a{50%{transform:translate(42px,-28px) rotate(-5deg)}}@keyframes fly-b{50%{transform:scale(.82) translate(-24px,18px) rotate(4deg)}}@keyframes fly-c{50%{transform:scale(.7) translate(30px,-17px) rotate(-5deg)}}@keyframes heart-beat{to{transform:translateX(-50%) scale(1.12);filter:drop-shadow(-17px 0 34px #ff875d) drop-shadow(17px 0 34px #88ddff)}}@keyframes burst{to{box-shadow:0 0 0 152px rgba(255,109,145,0);opacity:0}}
@media(max-width:560px){.card{top:5%;height:172px}.card-page{padding:21px 20px}.page-right p{font-size:14px}.bridge{bottom:32%;height:175px}.actors{bottom:29%;height:190px}.actor{width:120px;height:180px}.quote{bottom:13%;font-size:21px}.signature{bottom:8%;right:10%}.lantern{transform:scale(.78)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="qixi" aria-label="第一关通关后的七夕鹊桥结局">
 <div class="stars"></div><div class="meteor-field" aria-hidden="true"></div><div class="moon"></div><div class="mist a"></div><div class="mist b"></div>
 <div class="lantern left">七</div><div class="lantern right">夕</div>
 <section class="card" aria-label="七夕贺卡"><div class="card-cover"><span class="card-kicker">QIXI · 2026</span><span class="card-seal">七夕</span><h1>给洛小白</h1><span class="card-hint">轻启此笺</span></div><div class="card-inside"><div class="card-page page-left"><span>FOREST TEMPLE</span><i></i></div><div class="card-page page-right"><span class="seal">七夕</span><p>致独一无二的你：</p><p>愿每一次并肩，都通往更辽阔的星河。</p></div></div></section>
 <div class="bridge bridge-water"><svg class="bridge-arches" viewBox="0 0 1200 310" preserveAspectRatio="none" aria-label="鹊桥"><defs><linearGradient id="stone" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#d7d9d4"/><stop offset=".48" stop-color="#8e9297"/><stop offset="1" stop-color="#414856"/></linearGradient><linearGradient id="rail" x1="0" x2="1"><stop stop-color="#7c5a2f"/><stop offset=".5" stop-color="#e0bd75"/><stop offset="1" stop-color="#7c5a2f"/></linearGradient></defs><path class="bridge-mass" d="M0 155 Q210 60 400 145 Q600 34 800 145 Q990 60 1200 155 L1200 250 Q1000 220 800 238 Q600 208 400 238 Q200 220 0 250Z"/><path class="bridge-shadow" d="M0 243 Q200 215 400 234 Q600 204 800 234 Q1000 215 1200 243 L1200 310 L0 310Z"/><path class="bridge-archline" d="M35 210 Q205 79 390 210 M405 210 Q600 48 795 210 M810 210 Q995 79 1165 210"/><path class="bridge-holes" d="M48 219 Q205 105 376 219Z M422 219 Q600 73 778 219Z M824 219 Q995 105 1152 219Z"/><path class="bridge-deck" d="M0 140 Q210 105 400 135 Q600 78 800 135 Q990 105 1200 140 L1200 168 Q990 133 800 160 Q600 107 400 160 Q210 133 0 168Z"/><path class="bridge-rail" d="M75 127 Q210 95 384 121 Q600 55 816 121 Q990 95 1125 127"/><g class="bridge-posts"><path d="M116 122v42M170 112v45M225 104v48M281 104v48M336 113v44M460 109v50M515 91v57M570 79v64M630 79v64M685 91v57M740 109v50M864 113v44M919 104v48M975 104v48M1030 112v45M1084 122v42"/></g><g class="bridge-stones"><path d="M30 163h102m14-11h110m15-8h108m16-9h102m17-9h98m18 9h98m16 9h102m16 8h106m15 11h101M44 188h92m14 9h102m15 8h100m16 8h98m16 7h96m16-7h95m16-8h99m16-8h101m15-9h93M112 145v30m90-38v45m96-54v54m104-60v65m110-72v78m112 6v-84m104 7v65m99-59v54m94-46v43"/></g><g class="bridge-keystone"><path d="M600 48l20 36h-40z"/></g></svg><div class="bridge-reflection"></div><div class="water-ripples"></div><div class="lamp-reflection reflection-a"></div><div class="lamp-reflection reflection-b"></div><div class="bridge-pier pier-a"></div><div class="bridge-pier pier-b"></div><div class="bridge-lamp lamp-a"><i></i></div><div class="bridge-lamp lamp-b"><i></i></div></div>
 <div class="magpies" aria-label="喜鹊群"><svg viewBox="0 0 120 55" class="magpie a"><path d="M7 33 C24 11 46 13 59 28 C70 14 91 12 113 30 C92 24 79 33 66 42 C51 49 30 45 7 33Z"/><path class="wing" d="M49 28 C34 4 15 7 18 23 C28 18 39 26 51 34Z"/><path class="tail" d="M66 37 L102 53 L78 34Z"/></svg><svg viewBox="0 0 120 55" class="magpie b"><path d="M7 33 C24 11 46 13 59 28 C70 14 91 12 113 30 C92 24 79 33 66 42 C51 49 30 45 7 33Z"/><path class="wing" d="M49 28 C34 4 15 7 18 23 C28 18 39 26 51 34Z"/><path class="tail" d="M66 37 L102 53 L78 34Z"/></svg><svg viewBox="0 0 120 55" class="magpie c"><path d="M7 33 C24 11 46 13 59 28 C70 14 91 12 113 30 C92 24 79 33 66 42 C51 49 30 45 7 33Z"/><path class="wing" d="M49 28 C34 4 15 7 18 23 C28 18 39 26 51 34Z"/><path class="tail" d="M66 37 L102 53 L78 34Z"/></svg></div>
 <div class="actors"><img class="actor fire" src="assets/qixi/fire-complete-0.png" alt="火人"><img class="actor water" src="assets/qixi/water-complete-0.png" alt="冰人"><div class="heart"></div></div><div class="burst"></div>
 <p class="quote">与其说你美好，不如说，你不可重复</p><p class="signature">—— 洛小白</p>
</main>
<button class="back" type="button">返回游戏</button><button class="replay" type="button">重新播放</button>
<script>
(function(){
 const scene=document.querySelector('#qixi'),fire=document.querySelector('.fire'),water=document.querySelector('.water'),meteorField=document.querySelector('.meteor-field');let timer,run=0;
 function createMeteorShower(){meteorField.replaceChildren();for(let i=0;i<11;i+=1){const meteor=document.createElement('i');meteor.className='meteor';meteor.style.setProperty('--meteor-length',(70+Math.random()*115).toFixed(0)+'px');meteor.style.setProperty('--meteor-width',(5+Math.random()*5).toFixed(0)+'px');meteor.style.setProperty('--meteor-top',(5+Math.random()*50).toFixed(1)+'vh');meteor.style.setProperty('--meteor-duration',(4.8+Math.random()*4.5).toFixed(2)+'s');meteor.style.setProperty('--meteor-delay',(i<4?i*.32:1.8+Math.random()*6).toFixed(2)+'s');meteor.style.setProperty('--meteor-color',i%4===0?'#b9dfff':'#fff2c6');meteorField.appendChild(meteor)}}
 function frame(n){const id=n%2;fire.src='assets/qixi/fire-complete-'+id+'.png';water.src='assets/qixi/water-complete-'+id+'.png'}
 function play(){const ticket=++run;clearInterval(timer);scene.className='';createMeteorShower();frame(0);requestAnimationFrame(()=>{if(ticket===run)scene.classList.add('card-arrive')});setTimeout(()=>{if(ticket===run)scene.classList.add('card-open')},1150);setTimeout(()=>{if(ticket===run){scene.classList.add('bridge-ready');scene.classList.add('meteors-on')}},1650);setTimeout(()=>{if(ticket===run){scene.classList.add('walk');timer=setInterval(()=>frame(Math.floor(performance.now()/150)%2),150)}},2950);setTimeout(()=>{if(ticket===run){scene.classList.add('fuse');clearInterval(timer)}},6250);setTimeout(()=>{if(ticket===run)scene.classList.add('reveal')},7650)}
 document.querySelector('.replay').addEventListener('click',play);document.querySelector('.back').addEventListener('click',()=>location.replace('index.html'));play();
}());
</script>
</body>
</html>
