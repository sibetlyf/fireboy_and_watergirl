<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>七夕鹊桥 · 洛小白</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--night:#050914;--navy:#0b1224;--ink:#f0f3f8;--muted:#9ba8bc;--gold:#c4a264;--gold-dim:#6a593f;--paper:#e5dfd1;color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--night);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}button{font:inherit}
#qixi{position:relative;width:100%;height:100%;overflow:hidden;color:var(--ink);background:transparent}
canvas.three-bg{position:fixed;z-index:0;inset:0;pointer-events:none}
.overlay{position:absolute;z-index:10;inset:0;pointer-events:none}
.overlay>*{pointer-events:auto}
.stars,.stars::before,.stars::after{position:absolute;z-index:2;inset:0;content:"";background-image:radial-gradient(rgba(244,233,190,.72) 1px,transparent 1.55px),radial-gradient(rgba(164,193,232,.46) 1px,transparent 1.6px);background-position:5vw 13vh,81vw 20vh;background-size:18vw 17vh,24vw 22vh;opacity:.52;animation:drift 12s linear infinite;pointer-events:none}.stars::before{background-size:28vw 25vh,20vw 19vh;opacity:.38;animation-duration:18s}
.meteor-field{position:absolute;z-index:3;inset:0;overflow:hidden;pointer-events:none;opacity:0;transition:opacity 1.2s ease}.meteors-on .meteor-field{opacity:1}.meteor{position:absolute;top:var(--meteor-top);left:0;width:var(--meteor-length);height:1.5px;border-radius:999px;color:var(--meteor-color);background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.08) 18%,currentColor 78%,#fff 100%);filter:drop-shadow(0 0 5px currentColor);opacity:0;transform:translate3d(122vw,0,0) rotate(-25deg);animation:meteorFall var(--meteor-duration) var(--meteor-delay) cubic-bezier(.18,.58,.31,1) infinite both}.meteor::before{position:absolute;right:-2px;top:50%;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px currentColor;content:"";transform:translateY(-50%)}.meteor::after{position:absolute;left:18%;top:50%;width:42%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6));content:"";transform:translateY(-50%)}
.card{position:absolute;z-index:20;top:6%;left:50%;width:min(640px,84vw);height:190px;perspective:1600px;transform:translate(-50%,-175%) rotate(-2deg);transition:transform 1.15s cubic-bezier(.2,1.1,.3,1)}.card-cover,.card-inside{position:absolute;inset:0;border-radius:3px}.card-cover{z-index:2;display:grid;align-content:center;justify-items:center;gap:12px;border:1px solid rgba(196,162,100,.6);color:#eadfca;background:linear-gradient(135deg,#17233b,#0b1220 58%,#1a2941);box-shadow:0 20px 50px rgba(0,0,0,.58);transform-origin:left center;transition:transform 1.2s cubic-bezier(.55,.06,.33,1),opacity .55s .75s}.card-cover::before{position:absolute;inset:11px;border:1px solid rgba(196,162,100,.22);content:""}.card-kicker{font-size:10px;letter-spacing:.28em;color:#a6926e}.card-cover h1{margin:0;font:500 clamp(26px,4vw,39px)/1.05 Georgia,"Songti SC",serif;letter-spacing:.14em}.card-seal{position:absolute;top:20px;right:24px;display:grid;width:42px;height:42px;place-items:center;border:1px solid #b39460;border-radius:50%;color:#dbc38e;font:14px Georgia,"Songti SC",serif;transform:rotate(12deg)}.card-hint{font-size:11px;letter-spacing:.19em;color:#8592a7}.card-inside{display:grid;grid-template-columns:1fr 1fr;overflow:hidden;border:1px solid rgba(196,162,100,.48);background:#d8d0bf;box-shadow:0 20px 50px rgba(0,0,0,.4)}.card-page{position:relative;padding:25px 28px;color:#28334a;background:linear-gradient(135deg,#e8e2d6,#cfc6b3)}.page-left{border-right:1px solid rgba(83,68,47,.23);background:radial-gradient(circle at 50% 46%,rgba(196,162,100,.22),transparent 32%),#ddd5c4}.page-left span{position:absolute;bottom:25px;left:28px;color:#817157;font-size:10px;letter-spacing:.22em}.page-left i{position:absolute;top:50%;left:50%;display:grid;width:72px;height:72px;place-items:center;border:1px solid rgba(120,96,55,.35);border-radius:50%;color:#997a48;font-style:normal;font-size:25px;transform:translate(-50%,-50%)}.page-left i::before{content:"✦"}.page-right{font-family:Georgia,"Songti SC",serif}.page-right .seal{position:absolute;top:17px;right:22px;border:1px solid #a4655e;border-radius:50%;padding:7px;color:#8d2936;font-size:13px}.page-right p{margin:8px 0;font-size:17px;line-height:1.65}.card-arrive .card{transform:translate(-50%,0) rotate(-1deg)}.card-open .card-cover{transform:rotateY(-168deg);opacity:0;pointer-events:none}
.actors{position:absolute;z-index:15;bottom:31%;left:50%;width:min(820px,93vw);height:225px;transform:translateX(-50%)}.actor{position:absolute;bottom:0;width:154px;height:220px;object-fit:contain;filter:drop-shadow(0 15px 14px rgba(0,0,0,.48));transition:left 3s cubic-bezier(.34,.88,.2,1),opacity .55s,transform .25s}.fire{left:5%;filter:drop-shadow(0 0 14px rgba(255,93,57,.85)) drop-shadow(0 15px 14px rgba(0,0,0,.48))}.water{left:77%;filter:drop-shadow(0 0 14px rgba(79,208,255,.85)) drop-shadow(0 15px 14px rgba(0,0,0,.48))}.walk .fire{left:39%;transform:translateY(-8px)}.walk .water{left:48%;transform:translateY(-8px) scaleX(-1)}
.heart{position:absolute;bottom:18px;left:50%;z-index:2;width:140px;height:125px;opacity:0;transform:translateX(-50%) scale(.15);clip-path:path('M70 117 C59 106 4 75 4 39 C4 11 35 1 53 19 C61 26 65 34 70 42 C75 34 79 26 87 19 C105 1 136 11 136 39 C136 75 81 106 70 117 Z');background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.88) 0 3px,transparent 4px),linear-gradient(110deg,#ffd26a 0%,#f35b49 36%,#cc3e78 51%,#61c9ed 69%,#dafbff 100%);filter:drop-shadow(-16px 0 24px rgba(255,109,72,.78)) drop-shadow(16px 0 24px rgba(98,215,255,.78))}.fuse .actor{opacity:0}.fuse .heart{opacity:1;transform:translateX(-50%) scale(1);transition:opacity .45s .2s,transform .72s .2s cubic-bezier(.25,1.65,.45,1);animation:heart-beat 1s .85s infinite alternate}.burst{position:absolute;z-index:14;bottom:40%;left:50%;width:8px;height:8px;border-radius:50%;opacity:0;background:#fff4ce;transform:translateX(-50%);box-shadow:0 0 0 0 rgba(255,109,145,.85)}.fuse .burst{opacity:1;animation:burst 1.2s ease-out forwards}
.quote{position:absolute;z-index:25;bottom:11%;left:50%;width:min(90vw,790px);margin:0;color:#eaf0f7;opacity:0;transform:translate(-50%,26px);text-align:center;font:400 clamp(22px,3.4vw,46px)/1.5 Georgia,"Songti SC",serif;letter-spacing:.08em;text-shadow:0 3px 14px #050914}.signature{position:absolute;z-index:25;right:12%;bottom:6.5%;margin:0;color:#c9a86a;opacity:0;transform:translateY(14px);font:17px Georgia,"Songti SC",serif;letter-spacing:.15em}.reveal .quote{opacity:1;transform:translate(-50%,0);transition:opacity .8s,transform .8s}.reveal .signature{opacity:1;transform:translateY(0);transition:opacity .75s .6s,transform .75s .6s}
.back,.replay{position:fixed;z-index:30;bottom:20px;padding:10px 18px;border:1px solid #706044;border-radius:999px;color:#e8dcc4;background:rgba(11,18,35,.82);box-shadow:0 8px 26px rgba(0,0,0,.3);cursor:pointer;font-size:14px;backdrop-filter:blur(12px)}.back{left:20px}.replay{right:20px}.back:focus-visible,.replay:focus-visible{outline:2px solid #c4a264;outline-offset:3px}
@keyframes drift{to{transform:translateY(7px)}}@keyframes meteorFall{0%{opacity:0;transform:translate3d(122vw,0,0) rotate(-25deg)}8%{opacity:.95}74%{opacity:.75}100%{opacity:0;transform:translate3d(-32vw,0,0) rotate(-25deg)}}@keyframes heart-beat{to{transform:translateX(-50%) scale(1.12);filter:drop-shadow(-17px 0 34px #ff875d) drop-shadow(17px 0 34px #88ddff)}}@keyframes burst{to{box-shadow:0 0 0 152px rgba(255,109,145,0);opacity:0}}
@media(max-width:560px){.card{top:5%;height:172px}.card-page{padding:21px 20px}.page-right p{font-size:14px}.actors{bottom:29%;height:190px}.actor{width:120px;height:180px}.quote{bottom:13%;font-size:21px}.signature{bottom:8%;right:10%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas class="three-bg" id="particle-canvas"></canvas>
<main id="qixi" aria-label="第一关通关后的七夕鹊桥结局">
 <div class="stars"></div><div class="meteor-field" aria-hidden="true"></div>
 <section class="card" aria-label="七夕贺卡"><div class="card-cover"><span class="card-kicker">QIXI · 2026</span><span class="card-seal">七夕</span><h1>给洛小白</h1><span class="card-hint">轻启此笺</span></div><div class="card-inside"><div class="card-page page-left"><span>FOREST TEMPLE</span><i></i></div><div class="card-page page-right"><span class="seal">七夕</span><p>致独一无二的你：</p><p>愿每一次并肩，都通往更辽阔的星河。</p></div></div></section>
 <div class="actors"><img class="actor fire" src="assets/qixi/fire-complete-0.png" alt="火人"><img class="actor water" src="assets/qixi/water-complete-0.png" alt="冰人"><div class="heart"></div></div><div class="burst"></div>
 <p class="quote">与其说你美好，不如说，你不可重复</p><p class="signature">—— 洛小白</p>
</main>
<button class="back" type="button">返回游戏</button><button class="replay" type="button">重新播放</button>
<script>
(function(){
 const PARTICLE_COUNT=5000,TRANSITION_SPEED=.05;
 function spherePoint(r){const t=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);return{x:r*Math.sin(ph)*Math.cos(t),y:r*Math.sin(ph)*Math.sin(t),z:r*Math.cos(ph)}}
 const shapes={sphere:()=>{const p=spherePoint(4);return[p.x,p.y,p.z]},flower:()=>{const u=Math.random()*Math.PI*2,v=Math.random()*Math.PI,r=3+Math.sin(5*u)*Math.sin(4*v);return[r*Math.sin(v)*Math.cos(u),r*Math.sin(v)*Math.sin(u),r*Math.cos(v)*.5]},fireworks:()=>{const p=spherePoint(Math.random()*8);return[p.x,p.y,p.z]},heart:()=>{const t=Math.random()*Math.PI*2,r=Math.random();let x=16*Math.pow(Math.sin(t),3),y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t),z=(Math.random()-.5)*5;const s=.3;return[x*s,y*s+2,z*s]}};
 const shapeCycle=["sphere","flower","fireworks","heart"];
 let currentShapeIndex=0;

 const canvas=document.getElementById("particle-canvas");
 const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
 renderer.setSize(window.innerWidth,window.innerHeight);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
 const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x050914,.015);
 const camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,.1,1000);camera.position.z=14;camera.position.y=1.5;
 const texCanvas=document.createElement('canvas');texCanvas.width=32;texCanvas.height=32;const texCtx=texCanvas.getContext('2d'),grad=texCtx.createRadialGradient(16,16,0,16,16,16);grad.addColorStop(0,'rgba(255,255,255,1)');grad.addColorStop(1,'rgba(255,255,255,0)');texCtx.fillStyle=grad;texCtx.fillRect(0,0,32,32);const texture=new THREE.Texture(texCanvas);texture.needsUpdate=true;
 const geometry=new THREE.BufferGeometry(),positions=new Float32Array(PARTICLE_COUNT*3),targetPositions=new Float32Array(PARTICLE_COUNT*3);
 for(let i=0;i<PARTICLE_COUNT;i++){positions[i*3]=(Math.random()-.5)*8;positions[i*3+1]=(Math.random()-.5)*8;positions[i*3+2]=(Math.random()-.5)*8}
 geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));targetPositions.set(positions);
 const material=new THREE.PointsMaterial({color:0x4facfe,size:.14,map:texture,transparent:true,opacity:.75,depthWrite:false,blending:THREE.AdditiveBlending});
 const particles=new THREE.Points(geometry,material);particles.position.y=1.8;particles.scale.set(.78,.78,.78);scene.add(particles);

 function setShape(name){const gen=shapes[name]||shapes.sphere;for(let i=0;i<PARTICLE_COUNT;i++){const[x,y,z]=gen(i);targetPositions[i*3]=x;targetPositions[i*3+1]=y;targetPositions[i*3+2]=z}}
 setShape("sphere");
 setInterval(function(){currentShapeIndex=(currentShapeIndex+1)%shapeCycle.length;setShape(shapeCycle[currentShapeIndex])},5000);

 function animate(){requestAnimationFrame(animate);const arr=particles.geometry.attributes.position.array;for(let i=0;i<PARTICLE_COUNT*3;i++)arr[i]+=(targetPositions[i]-arr[i])*TRANSITION_SPEED;particles.geometry.attributes.position.needsUpdate=true;material.opacity=document.querySelector('#qixi').classList.contains('fuse')?.12:.75;particles.rotation.y+=.0015;renderer.render(scene,camera)}
 animate();
 window.addEventListener('resize',function(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)});
})();
</script>
<script>
(function(){
 const scene=document.querySelector('#qixi'),fire=document.querySelector('.fire'),water=document.querySelector('.water'),meteorField=document.querySelector('.meteor-field');let timer,run=0;
 function createMeteorShower(){meteorField.replaceChildren();for(let i=0;i<11;i+=1){const m=document.createElement('i');m.className='meteor';m.style.setProperty('--meteor-length',(70+Math.random()*115).toFixed(0)+'px');m.style.setProperty('--meteor-width',(5+Math.random()*5).toFixed(0)+'px');m.style.setProperty('--meteor-top',(5+Math.random()*50).toFixed(1)+'vh');m.style.setProperty('--meteor-duration',(7+Math.random()*7).toFixed(2)+'s');m.style.setProperty('--meteor-delay',(-Math.random()*14).toFixed(2)+'s');m.style.setProperty('--meteor-color',i%4===0?'#b9dfff':'#fff2c6');meteorField.appendChild(m)}}
 function frame(n){const id=n%2;fire.src='assets/qixi/fire-complete-'+id+'.png';water.src='assets/qixi/water-complete-'+id+'.png'}
 function play(){const ticket=++run;clearInterval(timer);scene.className='';createMeteorShower();frame(0);requestAnimationFrame(function(){if(ticket===run)scene.classList.add('card-arrive')});setTimeout(function(){if(ticket===run)scene.classList.add('card-open')},1150);setTimeout(function(){if(ticket===run)scene.classList.add('meteors-on')},1650);setTimeout(function(){if(ticket===run){scene.classList.add('walk');timer=setInterval(function(){frame(Math.floor(performance.now()/150)%2)},150)}},2950);setTimeout(function(){if(ticket===run){scene.classList.add('fuse');clearInterval(timer)}},6250);setTimeout(function(){if(ticket===run)scene.classList.add('reveal')},7650)}
 document.querySelector('.replay').addEventListener('click',play);document.querySelector('.back').addEventListener('click',function(){location.replace('index.html')});play();
}());
</script>
</body>
</html>
